# Builds installers for the three desktop OSes on a `v*` tag and attaches them to
# a GitHub Release.
#
# Only on a tag. `main` moves whenever the shell changes; a release is a
# deliberate act, and each one pins one version of the game (package.json →
# @andriy-fs/drone-directive-2-client).
name: release

on:
  push:
    tags: ['v*']

# Needed to create the release and upload assets. Note that this token cannot
# read the game package — see NODE_AUTH_TOKEN below.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `.npmrc` points the @andriy-fs scope at GitHub Packages and reads this
      # variable. The workflow's built-in GITHUB_TOKEN is scoped to *this*
      # repository and cannot read another repository's packages, so a classic PAT
      # with `read:packages` has to be stored as a repository secret.
      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Check
        run: |
          npm run lint
          npm run type-check

      # Unsigned on purpose for now: no Developer ID, no Windows certificate.
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder picking up a
      # random keychain identity on the macOS runner and producing a build signed
      # by nobody in particular.
      - name: Build installers
        run: npm run dist -- --publish never
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # An upload that stalls must fail the job, not hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      # The `gh` CLI preinstalled on the runner, not softprops/action-gh-release:
      # its v3 uploads assets in parallel and, for v0.4.0, hung indefinitely on the
      # .deb, .AppImage and both .exe files — on the first run and on every re-run.
      # `gh` uploads one file at a time. Create-or-upload keeps a re-run of a
      # half-published release idempotent: `--clobber` replaces what is already
      # there.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BODY: |
            ### Unsigned builds

            These binaries are not code-signed. macOS will refuse the first launch
            (right-click → Open, or System Settings → Privacy & Security → Open
            Anyway); Windows SmartScreen will warn (More info → Run anyway).
            Signing is tracked as an issue.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --verify-tag --generate-notes --notes "$BODY"
          fi
